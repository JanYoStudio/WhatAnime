[versions]
agp = "8.10.1"
kotlin = "2.1.21"
# https://github.com/google/ksp/releases
ksp = "2.1.21-2.0.1"

composeMultiplatform = "1.8.1"
aboutlibraries = "12.2.0"
kotlinx-serialization = "1.8.1"

android-compileSdk = "36"
android-minSdk = "24"
android-targetSdk = "36"
androidx-activity = "1.10.1"
androidx-appcompat = "1.7.0"
androidx-constraintlayout = "2.2.1"
androidx-splashscreen = "1.0.1"
androidx-core = "1.16.0"
androidx-lifecycle = "2.9.0"
androidx-navigation = "2.9.0-beta02"
androidx-browser = "1.8.0"
material = "1.12.0"
material-icons = "1.7.3"
ktorfit = "2.5.2"
ktor = "3.1.3"
koin-bom = "4.0.4"
coil-bom = "3.2.0"
kermit = "2.0.5"
cmptoast = "1.0.5"
filekit = "0.10.0-beta04"
mmkv-kotlin = "1.2.17"
media3 = "1.7.1"
room = "2.7.1"
kotlin-crypto-hash = "0.7.0"
compose-preference = "1.1.1"

[libraries]
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "androidx-core" }
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "androidx-appcompat" }
androidx-splashscreen = { module = "androidx.core:core-splashscreen", version.ref = "androidx-splashscreen" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activity" }
androidx-lifecycle-viewmodel = { module = "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel", version.ref = "androidx-lifecycle" }
androidx-navigation = { module = "org.jetbrains.androidx.navigation:navigation-compose", version.ref = "androidx-navigation" }
androidx-lifecycle-runtimeCompose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-runtime-compose", version.ref = "androidx-lifecycle" }
androidx-browser = { module = "androidx.browser:browser", version.ref = "androidx-browser" }

material = { module = "com.google.android.material:material", version.ref = "material" }

material-icon = { module = "org.jetbrains.compose.material:material-icons-core", version.ref = "material-icons" }
material-icon-extended = { module = "org.jetbrains.compose.material:material-icons-extended", version.ref = "material-icons" }

kotlinx-serialization = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }

ktorfit = { module = "de.jensklingenberg.ktorfit:ktorfit-lib-light", version.ref = "ktorfit" }

ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
