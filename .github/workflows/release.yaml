name: "Build Release"
on:
  workflow_dispatch:
env:
  OUTPUT_DIR: "composeApp/build/outputs/bundle/release"
  SIGN_KEY_ALIAS: ${{ secrets.SIGN_KEY_ALIAS }}
  SIGN_KEY_STORE_PASSWORD: ${{ secrets.SIGN_KEY_STORE_PASSWORD }}
  SIGN_KEY_PASSWORD: ${{ secrets.SIGN_KEY_PASSWORD }}
  SIGN_KEY_STORE_FILE: ${{ github.workspace }}/keystore.jks
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 设置JDK
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: 'temurin'
      - name: 设置Android SDK
        uses: android-actions/setup-android@v3
      - name: 解密签名
        run: |
          echo ${{ secrets.SIGN_KEY_BASE64 }} | base64 --decode > ${{ env.SIGN_KEY_STORE_FILE }}
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
      - name: 构建 APK
        run: |
          ./gradlew composeApp:exportLibraryDefinitions
          ./gradlew bundleRelease
      - name: 安装工具
        run: |
          sudo apt-get install wget -y
      - name: 解析版本号
        run: |
          wget -q -O /tmp/bundletool.jar https://github.com/google/bundletool/releases/download/1.18.2/bundletool-all-1.18.2.jar
          fileName=$(ls ${{ env.OUTPUT_DIR }}/ | head -n 1)
          versionName=$(java -jar /tmp/bundletool.jar dump manifest --bundle ${{ env.OUTPUT_DIR }}/$fileName --xpath /manifest/@android:versionName)
          echo "versionName=$versionName" >> $GITHUB_ENV
          echo "fileName=$fileName" >> $GITHUB_ENV
      - name: 发布版本
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.versionName }}
          body_path: CHANGELOG.md
          files: |
            ${{ env.OUTPUT_DIR }}/${{ env.fileName }}